<style>
  :root{
    --brand:#0b6b3a;
    --brand-dark:#084f2b;
    --brand-light:#e8f3ec;
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#e3e6e4;
    --text:#1c2620;
    --text-muted:#6b7570;
    --danger:#c0392b;
    --radius:14px;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  header.topbar{
    background:var(--brand);
    color:#fff;
    padding:calc(16px + var(--safe-top)) 20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  header.topbar .title{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  header.topbar .subtitle{
    font-size:12px;
    color:#bfe0cc;
    font-weight:500;
    margin-top:2px;
  }
  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    width:34px;
    height:34px;
    border-radius:10px;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,0.24);}

  main{
    flex:1;
    padding:16px 16px calc(96px + var(--safe-bottom));
  }

  /* Search */
  .search-wrap{
    margin-bottom:14px;
  }
  .search-wrap input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:15px;
    color:var(--text);
  }
  .search-wrap input:focus{outline:2px solid var(--brand);outline-offset:0;}

  /* Empty state */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
  }
  .empty-state .glyph{
    font-size:40px;
    margin-bottom:10px;
  }
  .empty-state h3{
    margin:0 0 6px;
    color:var(--text);
    font-size:17px;
  }
  .empty-state p{
    margin:0;
    font-size:14px;
    line-height:1.4;
  }

  /* Lead list */
  .lead-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .lead-row:active{background:#eef0f3;}
  .lead-row .main{min-width:0;}
  .lead-row .name{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lead-row .addr{
    font-size:13.5px;
    color:var(--text-muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lead-row .meta{
    text-align:right;
    flex-shrink:0;
  }
  .lead-row .date{
    font-size:12px;
    color:var(--text-muted);
  }
  .chip{
    display:inline-block;
    margin-top:6px;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    background:var(--brand-light);
    color:var(--brand-dark);
  }
  .chip + .chip{margin-left:6px;}

  /* FAB */
  .fab{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:calc(20px + var(--safe-bottom));
    width:calc(100% - 32px);
    max-width:528px;
    background:var(--brand);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:700;
    box-shadow:0 6px 16px rgba(0,0,0,0.18);
    cursor:pointer;
  }
  .fab:active{background:var(--brand-dark);}

  /* Views */
  .view{display:none;}
  .view.active{display:block;}

  /* Form */
  form .field{margin-bottom:16px;}
  form label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:6px;
  }
  form input, form textarea{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:16px;
    color:var(--text);
    font-family:inherit;
  }
  form input:focus, form textarea:focus{outline:2px solid var(--brand);outline-offset:0;}
  form textarea{resize:vertical;min-height:80px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .interest-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .interest-toggle{
    display:inline-flex;
    align-items:center;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    user-select:none;
  }
  .interest-toggle input{display:none;}
  .interest-toggle.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }

  form select{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:16px;
    color:var(--text);
    font-family:inherit;
  }
  form select:focus{outline:2px solid var(--brand);outline-offset:0;}

  .form-section-title{
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--brand-dark);
    margin:26px 0 14px;
    padding-bottom:6px;
    border-bottom:2px solid var(--brand-light);
  }
  .form-section-title:first-child{margin-top:0;}

  .yesno-group{display:flex;gap:8px;}
  .yesno-toggle{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:14.5px;
    font-weight:700;
    color:var(--text);
    cursor:pointer;
  }
  .yesno-toggle.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }

  .form-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    border:none;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:active{background:var(--brand-dark);}
  .btn-secondary{background:#e9ebee;color:var(--text);}
  .btn-secondary:active{background:#dcdfe4;}
  .btn-danger{background:#fdecea;color:var(--danger);}
  .btn-danger:active{background:#fbdad6;}

  /* Detail view */
  .detail-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .detail-card h2{
    margin:0 0 2px;
    font-size:20px;
  }
  .detail-card .addr{
    color:var(--text-muted);
    font-size:14px;
    margin-bottom:14px;
  }
  .detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 16px;
    margin-bottom:6px;
  }
  .detail-item .label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--text-muted);
    margin-bottom:2px;
  }
  .detail-item .value{
    font-size:14.5px;
    color:var(--text);
  }
  .detail-item.full{grid-column:1 / -1;}
  .detail-note{
    border-top:1px solid var(--border);
    margin-top:12px;
    padding-top:12px;
  }

  .back-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    color:var(--brand);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* Export fallback modal */
  .export-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .export-modal{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    max-width:520px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .export-modal p{margin:0;font-size:13px;color:var(--text-muted);line-height:1.4;}
  .export-modal textarea{
    width:100%;
    flex:1;
    min-height:220px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    color:var(--text);
    background:var(--bg);
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div>
      <div class="title">Genesis Home Improvements</div>
      <div class="subtitle" id="headerSubtitle">Lead Tracker</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="exportBtn" title="Export leads">&#8659;</button>
      <button class="icon-btn" id="newBtnTop" title="New lead">+</button>
    </div>
  </header>

  <main>

    <!-- LIST VIEW -->
    <section class="view active" id="view-list">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search by name or address">
      </div>
      <div id="listContainer"></div>
    </section>

    <!-- FORM VIEW (add/edit) -->
    <section class="view" id="view-form">
      <div class="back-row" id="cancelFormBtn">&larr; Cancel</div>
      <form id="leadForm">
        <div class="form-section-title">Contact Info</div>
        <div class="row2">
          <div class="field">
            <label>First Name</label>
            <input type="text" id="f_first_name" required>
          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" id="f_last_name">
          </div>
        </div>
        <div class="field">
          <label>Spouse</label>
          <input type="text" id="f_spouse">
        </div>
        <div class="field">
          <label>Address</label>
          <input type="text" id="f_address" required>
        </div>
        <div class="field">
          <label>Zip Code</label>
          <input type="text" id="f_zip" inputmode="numeric">
        </div>
        <div class="row2">
          <div class="field">
            <label>Contact Number</label>
            <input type="tel" id="f_phone">
          </div>
          <div class="field">
            <label>Alt Number</label>
            <input type="tel" id="f_alt_phone">
          </div>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="f_email">
        </div>

        <div class="form-section-title">Interested In</div>
        <div class="field">
          <div class="interest-group" id="interestGroup">
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="Windows">Windows</label>
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="Roofing">Roofing</label>
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="Painting">Painting</label>
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="Patio Covers">Patio Covers</label>
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="HVAC">HVAC</label>
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="Stucco/Wood">Stucco/Wood</label>
            <label class="interest-toggle"><input type="checkbox" class="f_interest" value="Hardscape/Landscape/Pavers/Turf">Hardscape/Landscape/Pavers/Turf</label>
          </div>
        </div>

        <div class="form-section-title">Rapport Builder</div>
        <div class="row2">
          <div class="field">
            <label>Years Owned</label>
            <input type="text" id="f_years_owned" inputmode="numeric">
          </div>
          <div class="field">
            <label># of Windows</label>
            <input type="text" id="f_window_count" inputmode="numeric">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label># of Sliding Doors</label>
            <input type="text" id="f_sliding_doors" inputmode="numeric">
          </div>
          <div class="field">
            <label># of French Doors</label>
            <input type="text" id="f_french_doors" inputmode="numeric">
          </div>
        </div>
        <div class="field">
          <label>Pet Door</label>
          <div class="yesno-group" id="petDoorGroup" data-field="pet_door">
            <button type="button" class="yesno-toggle" data-value="Yes">Yes</button>
            <button type="button" class="yesno-toggle" data-value="No">No</button>
          </div>
        </div>

        <div class="form-section-title">Roof</div>
        <div class="row2">
          <div class="field">
            <label>Roof Age</label>
            <input type="text" id="f_roof_age" placeholder="e.g. 12 years">
          </div>
          <div class="field">
            <label># of Layers</label>
            <input type="text" id="f_roof_layers" inputmode="numeric">
          </div>
        </div>
        <div class="field">
          <label>Solar Panels on Roof?</label>
          <div class="yesno-group" id="solarGroup" data-field="solar_panels">
            <button type="button" class="yesno-toggle" data-value="Yes">Yes</button>
            <button type="button" class="yesno-toggle" data-value="No">No</button>
          </div>
        </div>
        <div class="field" id="solarCountField" style="display:none;">
          <label># of Panels</label>
          <input type="text" id="f_solar_panel_count" inputmode="numeric">
        </div>
        <div class="field">
          <label>Any Leaks?</label>
          <div class="yesno-group" id="leaksGroup" data-field="roof_leaks">
            <button type="button" class="yesno-toggle" data-value="Yes">Yes</button>
            <button type="button" class="yesno-toggle" data-value="No">No</button>
          </div>
        </div>
        <div class="field" id="leakLocationField" style="display:none;">
          <label>What Part of the Roof</label>
          <input type="text" id="f_leak_location">
        </div>

        <div class="form-section-title">Paint &amp; Stucco</div>
        <div class="row2">
          <div class="field">
            <label>Last Time Painted</label>
            <input type="text" id="f_last_painted" placeholder="e.g. 2019 or 'never'">
          </div>
          <div class="field">
            <label>What Colors</label>
            <input type="text" id="f_paint_colors">
          </div>
        </div>
        <div class="field">
          <label>Fascia Repairs / Wood Replacement</label>
          <input type="text" id="f_fascia">
        </div>
        <div class="row2">
          <div class="field">
            <label>Cracks</label>
            <input type="text" id="f_cracks">
          </div>
          <div class="field">
            <label>Wear and Tear</label>
            <input type="text" id="f_wear_tear">
          </div>
        </div>

        <div class="form-section-title">Appointment</div>
        <div class="row2">
          <div class="field">
            <label>Day</label>
            <select id="f_appt_day">
              <option value="">Select day</option>
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
              <option>Saturday</option>
            </select>
          </div>
          <div class="field">
            <label>Date</label>
            <input type="date" id="f_appt_date">
          </div>
        </div>
        <div class="field">
          <label>Time</label>
          <select id="f_appt_time">
            <option value="">Select time</option>
            <option>10:00 AM</option>
            <option>11:00 AM</option>
            <option>12:00 PM</option>
            <option>1:00 PM</option>
            <option>2:00 PM</option>
            <option>3:00 PM</option>
            <option>4:00 PM</option>
            <option>5:00 PM</option>
            <option>6:00 PM</option>
          </select>
        </div>

        <div class="form-section-title">Notes</div>
        <div class="field">
          <textarea id="f_notes" placeholder="Comments, notes, or concerns..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelFormBtn2">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Lead</button>
        </div>
      </form>
    </section>

    <!-- DETAIL VIEW -->
    <section class="view" id="view-detail">
      <div class="back-row" id="backFromDetailBtn">&larr; All Leads</div>
      <div class="detail-card" id="detailCard"></div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="editBtn">Edit</button>
        <button class="btn btn-danger" id="deleteBtn">Delete</button>
      </div>
    </section>

  </main>

  <button class="fab" id="newBtnFab">+ New Lead</button>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "genesis_leadgen_leads_v1";
  var leads = [];
  var editingId = null;
  var viewingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      leads = raw ? JSON.parse(raw) : [];
    }catch(e){
      leads = [];
    }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
  }
  function uid(){
    return "l_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function esc(s){
    if(s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
  }
  function fmtIsoDate(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    if(parts.length !== 3) return iso;
    return parts[1] + "/" + parts[2] + "/" + parts[0];
  }
  function fullName(first, last){
    return (first || "") + (last ? " " + last : "");
  }

  function showView(id){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
    document.getElementById("newBtnFab").style.display = (id === "view-list") ? "" : "none";
    window.scrollTo(0,0);
  }

  function renderList(){
    var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
    var container = document.getElementById("listContainer");
    var sorted = leads.slice().sort(function(a,b){ return b.created_at - a.created_at; });
    var filtered = sorted.filter(function(l){
      if(!q) return true;
      return (l.homeowner_name||"").toLowerCase().indexOf(q) !== -1 ||
             (l.address||"").toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById("headerSubtitle").textContent =
      leads.length + (leads.length === 1 ? " Lead" : " Leads") + " Captured";

    if(filtered.length === 0){
      if(leads.length === 0){
        container.innerHTML =
          '<div class="empty-state">' +
            '<div class="glyph">&#128203;</div>' +
            '<h3>No leads yet</h3>' +
            '<p>Tap "+ New Lead" below to capture your first homeowner lead.</p>' +
          '</div>';
      } else {
        container.innerHTML =
          '<div class="empty-state">' +
            '<div class="glyph">&#128269;</div>' +
            '<h3>No matches</h3>' +
            '<p>No leads match your search.</p>' +
          '</div>';
      }
      return;
    }

    container.innerHTML = filtered.map(function(l){
      var tagLine = (l.interests && l.interests.length) ? esc(l.interests.join(" · ")) : "";
      return (
        '<div class="lead-row" data-id="' + l.id + '">' +
          '<div class="main">' +
            '<div class="name">' + esc(l.homeowner_name || "Unnamed") + '</div>' +
            '<div class="addr">' + esc(l.address || "No address") + '</div>' +
            (tagLine ? '<div class="addr" style="color:var(--brand-dark);font-weight:600;">' + tagLine + '</div>' : '') +
          '</div>' +
          '<div class="meta">' +
            '<div class="date">' + fmtDate(l.created_at) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    Array.prototype.forEach.call(container.querySelectorAll(".lead-row"), function(el){
      el.addEventListener("click", function(){
        openDetail(el.getAttribute("data-id"));
      });
    });
  }

  function resetForm(){
    editingId = null;
    document.getElementById("leadForm").reset();
    Array.prototype.forEach.call(document.querySelectorAll(".interest-toggle"), function(el){
      el.classList.remove("active");
    });
    Array.prototype.forEach.call(document.querySelectorAll(".yesno-group"), function(group){
      delete group.dataset.value;
      Array.prototype.forEach.call(group.querySelectorAll(".yesno-toggle"), function(btn){
        btn.classList.remove("active");
      });
    });
    updateConditionalFields();
  }

  function getCheckedInterests(){
    return Array.prototype.filter.call(document.querySelectorAll(".f_interest"), function(el){
      return el.checked;
    }).map(function(el){ return el.value; });
  }

  function setCheckedInterests(interests){
    interests = interests || [];
    Array.prototype.forEach.call(document.querySelectorAll(".f_interest"), function(el){
      var on = interests.indexOf(el.value) !== -1;
      el.checked = on;
      el.closest(".interest-toggle").classList.toggle("active", on);
    });
  }

  function getYesNo(field){
    var group = document.querySelector('.yesno-group[data-field="' + field + '"]');
    return (group && group.dataset.value) || "";
  }

  function setYesNo(field, value){
    var group = document.querySelector('.yesno-group[data-field="' + field + '"]');
    if(!group) return;
    if(value){ group.dataset.value = value; } else { delete group.dataset.value; }
    Array.prototype.forEach.call(group.querySelectorAll(".yesno-toggle"), function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-value") === value);
    });
    updateConditionalFields();
  }

  function updateConditionalFields(){
    document.getElementById("solarCountField").style.display =
      getYesNo("solar_panels") === "Yes" ? "" : "none";
    document.getElementById("leakLocationField").style.display =
      getYesNo("roof_leaks") === "Yes" ? "" : "none";
  }

  function openNewForm(){
    resetForm();
    document.getElementById("saveBtn").textContent = "Save Lead";
    showView("view-form");
    setTimeout(function(){
      document.getElementById("f_first_name").focus();
    }, 50);
  }

  function openEditForm(id){
    var l = leads.find(function(x){ return x.id === id; });
    if(!l) return;
    editingId = id;
    document.getElementById("f_first_name").value = l.first_name || "";
    document.getElementById("f_last_name").value = l.last_name || "";
    document.getElementById("f_spouse").value = l.spouse || "";
    document.getElementById("f_address").value = l.address || "";
    document.getElementById("f_zip").value = l.zip || "";
    setCheckedInterests(l.interests);
    document.getElementById("f_phone").value = l.phone || "";
    document.getElementById("f_alt_phone").value = l.alt_phone || "";
    document.getElementById("f_email").value = l.email || "";
    document.getElementById("f_years_owned").value = l.years_owned || "";
    document.getElementById("f_window_count").value = l.window_count || "";
    document.getElementById("f_sliding_doors").value = l.sliding_doors || "";
    document.getElementById("f_french_doors").value = l.french_doors || "";
    setYesNo("pet_door", l.pet_door || "");
    document.getElementById("f_roof_age").value = l.roof_age || "";
    document.getElementById("f_roof_layers").value = l.roof_layers || "";
    setYesNo("solar_panels", l.solar_panels || "");
    document.getElementById("f_solar_panel_count").value = l.solar_panel_count || "";
    setYesNo("roof_leaks", l.roof_leaks || "");
    document.getElementById("f_leak_location").value = l.leak_location || "";
    document.getElementById("f_last_painted").value = l.last_painted || "";
    document.getElementById("f_paint_colors").value = l.paint_colors || "";
    document.getElementById("f_fascia").value = l.fascia || "";
    document.getElementById("f_cracks").value = l.cracks || "";
    document.getElementById("f_wear_tear").value = l.wear_tear || "";
    document.getElementById("f_appt_day").value = l.appt_day || "";
    document.getElementById("f_appt_date").value = l.appt_date || "";
    document.getElementById("f_appt_time").value = l.appt_time || "";
    document.getElementById("f_notes").value = l.notes || "";
    document.getElementById("saveBtn").textContent = "Save Changes";
    showView("view-form");
  }

  function openDetail(id){
    var l = leads.find(function(x){ return x.id === id; });
    if(!l) return;
    viewingId = id;

    function item(label, value, full){
      return '<div class="detail-item' + (full ? ' full' : '') + '">' +
               '<div class="label">' + esc(label) + '</div>' +
               '<div class="value">' + (value ? esc(value) : '<span style="color:var(--text-muted)">&mdash;</span>') + '</div>' +
             '</div>';
    }

    var interestsHtml = (l.interests && l.interests.length)
      ? l.interests.map(function(i){ return '<span class="chip">' + esc(i) + '</span>'; }).join("")
      : "";

    var apptBits = [l.appt_day, fmtIsoDate(l.appt_date), l.appt_time].filter(Boolean).join(" ");

    function sectionTitle(t){
      return '<div class="form-section-title">' + esc(t) + '</div>';
    }

    var html =
      '<h2>' + esc(fullName(l.first_name, l.last_name) || "Unnamed") + '</h2>' +
      '<div class="addr">' + esc(l.address || "No address") + (l.zip ? ", " + esc(l.zip) : "") + '</div>' +
      (interestsHtml ? '<div style="margin-bottom:14px;">' + interestsHtml + '</div>' : '') +

      sectionTitle("Contact Info") +
      '<div class="detail-grid">' +
        item("Spouse", l.spouse) +
        item("Contact Number", l.phone) +

      sectionTitle("Roof") +
      '<div class="detail-grid">' +
        item("Roof Age", l.roof_age) +

        item("# Panels", l.solar_panel_count) +
        item("Any Leaks", l.roof_leaks) +
        item("Leak Location", l.leak_location) +
      '</div>' +

      sectionTitle("Paint & Stucco") +
      '<div class="detail-grid">' +
        item("Last Painted", l.last_painted) +
        item("Colors", l.paint_colors) +
        item("Fascia/Wood Replacement", l.fascia, true) +
        item("Cracks", l.cracks) +

      sectionTitle("Appointment") +
      '<div class="detail-grid">' +
        item("Scheduled", apptBits, true) +
      '</div>' +

      '<div class="detail-note">' +
        '<div class="label" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:4px;">Notes</div>' +
        '<div class="value">' + (l.notes ? esc(l.notes) : '<span style="color:var(--text-muted)">No notes</span>') + '</div>' +
      '</div>' +

    document.getElementById("detailCard").innerHTML = html;
    showView("view-detail");
  }

  document.getElementById("leadForm").addEventListener("submit", function(e){
    e.preventDefault();
    var firstName = document.getElementById("f_first_name").value.trim();
    var lastName = document.getElementById("f_last_name").value.trim();
    var data = {
      first_name: firstName,
      last_name: lastName,
      homeowner_name: fullName(firstName, lastName),
      spouse: document.getElementById("f_spouse").value.trim(),
      address: document.getElementById("f_address").value.trim(),
      zip: document.getElementById("f_zip").value.trim(),
      interests: getCheckedInterests(),
      phone: document.getElementById("f_phone").value.trim(),
      alt_phone: document.getElementById("f_alt_phone").value.trim(),
      email: document.getElementById("f_email").value.trim(),
      years_owned: document.getElementById("f_years_owned").value.trim(),
      window_count: document.getElementById("f_window_count").value.trim(),
      sliding_doors: document.getElementById("f_sliding_doors").value.trim(),
      french_doors: document.getElementById("f_french_doors").value.trim(),
      pet_door: getYesNo("pet_door"),
      roof_age: document.getElementById("f_roof_age").value.trim(),
      roof_layers: document.getElementById("f_roof_layers").value.trim(),
      solar_panels: getYesNo("solar_panels"),
      solar_panel_count: document.getElementById("f_solar_panel_count").value.trim(),
      roof_leaks: getYesNo("roof_leaks"),
      leak_location: document.getElementById("f_leak_location").value.trim(),
      last_painted: document.getElementById("f_last_painted").value.trim(),
      paint_colors: document.getElementById("f_paint_colors").value.trim(),
      fascia: document.getElementById("f_fascia").value.trim(),
      cracks: document.getElementById("f_cracks").value.trim(),
      wear_tear: document.getElementById("f_wear_tear").value.trim(),
      appt_day: document.getElementById("f_appt_day").value,
      appt_date: document.getElementById("f_appt_date").value,
      appt_time: document.getElementById("f_appt_time").value,
      notes: document.getElementById("f_notes").value.trim()
    };

    if(editingId){
      var l = leads.find(function(x){ return x.id === editingId; });
      Object.assign(l, data);
    } else {
      data.id = uid();
      data.created_at = Date.now();
      leads.push(data);
    }
    save();
    renderList();
    if(editingId){
      openDetail(editingId);
    } else {
      showView("view-list");
    }
    resetForm();
  });

  var CSV_FIELDS = [
    ["created_at", "Date Captured"],
    ["first_name", "First Name"],
    ["last_name", "Last Name"],
    ["spouse", "Spouse"],
    ["address", "Address"],
    ["zip", "Zip"],
    ["phone", "Contact Number"],
    ["alt_phone", "Alt Number"],
    ["email", "Email"],
    ["interests", "Interested In"],
    ["years_owned", "Years Owned"],
    ["window_count", "# Windows"],
    ["sliding_doors", "# Sliding Doors"],
    ["french_doors", "# French Doors"],
    ["pet_door", "Pet Door"],
    ["roof_age", "Roof Age"],
    ["roof_layers", "# Layers"],
    ["solar_panels", "Solar Panels"],
    ["solar_panel_count", "# Panels"],
    ["roof_leaks", "Any Leaks"],
    ["leak_location", "Leak Location"],
    ["last_painted", "Last Painted"],
    ["paint_colors", "Paint Colors"],
    ["fascia", "Fascia/Wood Replacement"],
    ["cracks", "Cracks"],
    ["wear_tear", "Wear and Tear"],
    ["appt_day", "Appt Day"],
    ["appt_date", "Appt Date"],
    ["appt_time", "Appt Time"],
    ["notes", "Notes"]
  ];

  function csvEscape(v){
    if(v === undefined || v === null) return "";
    var s = String(v);
    if(/[",\n]/.test(s)){
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function buildCSV(){
    var header = CSV_FIELDS.map(function(f){ return csvEscape(f[1]); }).join(",");
    var rows = leads.slice().sort(function(a,b){ return a.created_at - b.created_at; }).map(function(l){
      return CSV_FIELDS.map(function(f){
        var key = f[0];
        var val;
        if(key === "created_at"){ val = fmtDate(l.created_at); }
        else if(key === "interests"){ val = (l.interests || []).join("; "); }
        else { val = l[key]; }
        return csvEscape(val);
      }).join(",");
    });
    return [header].concat(rows).join("\r\n");
  }

  function showExportFallback(csv){
    var overlay = document.createElement("div");
    overlay.className = "export-overlay";
    overlay.innerHTML =
      '<div class="export-modal">' +
        '<div class="form-section-title" style="margin:0;">Export Leads</div>' +
        '<p>Your browser blocked the direct share/download. Tap "Copy All", then paste into Notes, Email, or a spreadsheet app to save your leads.</p>' +
        '<textarea readonly id="exportTextarea"></textarea>' +
        '<div class="form-actions">' +
          '<button type="button" class="btn btn-secondary" id="exportCloseBtn">Close</button>' +
          '<button type="button" class="btn btn-primary" id="exportCopyBtn">Copy All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    var ta = overlay.querySelector("#exportTextarea");
    ta.value = csv;
    overlay.querySelector("#exportCloseBtn").addEventListener("click", function(){
      document.body.removeChild(overlay);
    });
    overlay.querySelector("#exportCopyBtn").addEventListener("click", function(){
      ta.focus();
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(csv).then(function(){
          alert("Copied to clipboard.");
        }).catch(function(){
          try{ document.execCommand("copy"); alert("Copied to clipboard."); }
          catch(e){ alert("Couldn't copy automatically — the text is selected, copy it manually."); }
        });
      } else {
        try{ document.execCommand("copy"); alert("Copied to clipboard."); }
        catch(e){ alert("Couldn't copy automatically — the text is selected, copy it manually."); }
      }
    });
    setTimeout(function(){ ta.focus(); ta.select(); }, 50);
  }

  function exportLeads(){
    if(leads.length === 0){
      alert("No leads to export yet.");
      return;
    }
    var csv = buildCSV();
    var filename = "genesis-leads-" + new Date().toISOString().slice(0,10) + ".csv";

    try {
      var file = new File([csv], filename, { type: "text/csv" });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({ files: [file], title: "Genesis Leads Export" }).catch(function(){});
        return;
      }
    } catch(e){}

    try {
      var blob = new Blob([csv], { type: "text/csv" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return;
    } catch(e){}

    showExportFallback(csv);
  }

  document.getElementById("exportBtn").addEventListener("click", exportLeads);
  document.getElementById("newBtnTop").addEventListener("click", openNewForm);
  document.getElementById("newBtnFab").addEventListener("click", openNewForm);
  document.getElementById("cancelFormBtn").addEventListener("click", function(){
    resetForm();
    showView(editingId === null ? "view-list" : "view-detail");
  });
  document.getElementById("cancelFormBtn2").addEventListener("click", function(){
    var wasEditing = editingId;
    resetForm();
    showView(wasEditing ? "view-detail" : "view-list");
  });
  document.getElementById("backFromDetailBtn").addEventListener("click", function(){
    viewingId = null;
    showView("view-list");
    renderList();
  });
  document.getElementById("editBtn").addEventListener("click", function(){
    openEditForm(viewingId);
  });
  document.getElementById("deleteBtn").addEventListener("click", function(){
    if(!viewingId) return;
    if(confirm("Delete this lead? This can't be undone.")){
      leads = leads.filter(function(x){ return x.id !== viewingId; });
      save();
      viewingId = null;
      showView("view-list");
      renderList();
    }
  });
  document.getElementById("searchInput").addEventListener("input", renderList);
  document.getElementById("interestGroup").addEventListener("change", function(e){
    if(e.target.classList.contains("f_interest")){
      e.target.closest(".interest-toggle").classList.toggle("active", e.target.checked);
    }
  });
  document.getElementById("leadForm").addEventListener("click", function(e){
    var btn = e.target.closest(".yesno-toggle");
    if(!btn) return;
    var group = btn.closest(".yesno-group");
    var field = group.getAttribute("data-field");
    var value = group.dataset.value === btn.getAttribute("data-value") ? "" : btn.getAttribute("data-value");
    setYesNo(field, value);
  });

  load();
  renderList();
})();
</script>
