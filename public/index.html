<style>
  :root{
    --brand:#152535;
    --brand-dark:#0b151f;
    --brand-light:#e9edf2;
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#e3e6e4;
    --text:#1c2620;
    --text-muted:#6b7570;
    --danger:#c0392b;
    --accent:#c2735f;
    --radius:14px;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  header.topbar{
    background:#fff;
    color:var(--brand);
    border-bottom:3px solid var(--accent);
    padding:calc(16px + var(--safe-top)) 20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  header.topbar .title{
    font-size:18px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  header.topbar .logo{display:block;height:44px;width:auto;max-width:100%;}
  header.topbar .subtitle{
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.3px;
    font-weight:500;
    margin-top:2px;
  }
  .icon-btn{
    background:var(--brand-light);
    border:none;
    color:var(--brand);
    width:34px;
    height:34px;
    border-radius:10px;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:#d6dde6;}

  main{
    flex:1;
    padding:16px 16px calc(96px + var(--safe-bottom));
  }

  /* Search */
  .search-wrap{
    margin-bottom:14px;
  }
  .search-wrap input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:15px;
    color:var(--text);
  }
  .search-wrap input:focus{outline:2px solid var(--brand);outline-offset:0;}

  /* Empty state */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
  }
  .empty-state .glyph{
    font-size:40px;
    margin-bottom:10px;
  }
  .empty-state h3{
    margin:0 0 6px;
    color:var(--text);
    font-size:17px;
  }
  .empty-state p{
    margin:0;
    font-size:14px;
    line-height:1.4;
  }

  /* Lead list */
  .lead-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .lead-row:active{background:#eef0f3;}
  .lead-row .main{min-width:0;}
  .lead-row .name{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lead-row .addr{
    font-size:13.5px;
    color:var(--text-muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lead-row .meta{
    text-align:right;
    flex-shrink:0;
  }
  .lead-row .date{
    font-size:12px;
    color:var(--text-muted);
  }
  .chip{
    display:inline-block;
    margin-top:6px;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;

<body>
<div id="app">

  <header class="topbar">

        </div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "genesis_leadgen_leads_v1";
  var leads = [];
  var editingId = null;
  var viewingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      leads = raw ? JSON.parse(raw) : [];
    }catch(e){
      leads = [];
    }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
  }
  function uid(){
    return "l_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function esc(s){
    if(s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
  }
  function fmtIsoDate(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    if(parts.length !== 3) return iso;
    return parts[1] + "/" + parts[2] + "/" + parts[0];
  }
  function fullName(first, last){
    return (first || "") + (last ? " " + last : "");
  }

  var STATUSES = [
    ["New","st-new"],["No Answer","st-noanswer"],["Contacted","st-contacted"],
    ["Appt Set","st-appt"],["Sent to Monday","st-sent"],["Pitch & Miss","st-miss"],["Sold","st-sold"],["Not Interested","st-dead"]
  ];
  var CLOSED = ["Sold","Not Interested"];
  var currentTab = null;
  function statusOf(l){ return l.status || "New"; }
  function statusClass(st){ for(var i=0;i<STATUSES.length;i++){ if(STATUSES[i][0]===st) return STATUSES[i][1]; } return "st-new"; }
  function isOpen(l){ return CLOSED.indexOf(statusOf(l)) === -1; }
  function todayISO(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function addDaysISO(n){ var d=new Date(); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function isDue(l){ return isOpen(l) && l.next_followup && l.next_followup <= todayISO(); }
  function dueLabel(l){
    if(!isOpen(l) || !l.next_followup) return "";
    var t = todayISO();
    if(l.next_followup < t) return '<div class="due over">Overdue \u00b7 ' + esc(fmtIsoDate(l.next_followup)) + '</div>';
    if(l.next_followup === t) return '<div class="due today">Follow up today</div>';
    return '<div class="due later">Next: ' + esc(fmtIsoDate(l.next_followup)) + '</div>';
  }
  function addLog(l, text){ l.log = l.log || []; l.log.unshift({ ts: Date.now(), text: text }); }
  var TABS = [
    ["due","Due", function(l){ return isDue(l); }],
    ["new","New", function(l){ return statusOf(l)==="New"; }],
    ["booked","Booked", function(l){ var s=statusOf(l); return s==="Appt Set"||s==="Sent to Monday"; }],
    ["sold","Sold", function(l){ return statusOf(l)==="Sold"; }],
    ["all","All", function(){ return true; }]
  ];
  function fmtMoney(n){ return "$" + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 }); }
  function parseMoney(v){ var n = parseFloat(String(v || "").replace(/[^0-9.]/g, "")); return isNaN(n) ? "" : n; }

  function renderList(){
    var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();

    if(!currentTab){ currentTab = leads.some(isDue) ? "due" : "all"; }
    var tabFn = TABS.filter(function(t){ return t[0]===currentTab; })[0][2];
    document.getElementById("tabs").innerHTML = TABS.map(function(t){
      return '<button type="button" class="tab' + (t[0]===currentTab?' active':'') + '" data-tab="' + t[0] + '">' + t[1] + '<span class="n">' + leads.filter(t[2]).length + '</span></button>';
    }).join("");
    var sorted = leads.slice().sort(function(a,b){
      if(currentTab === "due"){ return (a.next_followup||"").localeCompare(b.next_followup||""); }
      return b.created_at - a.created_at;
    });
    var filtered = sorted.filter(function(l){
      if(!q && !tabFn(l)) return false;
      if(!q) return true;

             (l.address||"").toLowerCase().indexOf(q) !== -1;

    var banner = "";

          '</div>' +

            '<div class="date">' + fmtDate(l.created_at) + '</div>' +
            '<span class="badge ' + statusClass(statusOf(l)) + '">' + esc(statusOf(l)) + (statusOf(l)==="Sold" && l.sale_amount ? ' \u00b7 ' + esc(fmtMoney(l.sale_amount)) : '') + '</span>' +
            dueLabel(l) +

  function csvEscape(v){
    if(v === undefined || v === null) return "";
    var s = String(v);
    if(/[",\n]/.test(s)){
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function buildCSV(){
    var header = CSV_FIELDS.map(function(f){ return csvEscape(f[1]); }).join(",");
    var rows = leads.slice().sort(function(a,b){ return a.created_at - b.created_at; }).map(function(l){
      return CSV_FIELDS.map(function(f){
        var key = f[0];
        var val;
        if(key === "created_at"){ val = fmtDate(l.created_at); }
        else if(key === "interests"){ val = (l.interests || []).join("; "); }
        else if(key === "status"){ val = statusOf(l); }
        else if(key === "log"){ val = (l.log || []).map(function(e){ return fmtDate(e.ts) + ": " + e.text; }).join(" | "); }
        else { val = l[key]; }
        return csvEscape(val);
      }).join(",");
    });
    return [header].concat(rows).join("\r\n");
  }

  function showExportFallback(csv){
    var overlay = document.createElement("div");
    overlay.className = "export-overlay";
    overlay.innerHTML =
      '<div class="export-modal">' +
        '<div class="form-section-title" style="margin:0;">Export Leads</div>' +
        '<p>Your browser blocked the direct share/download. Tap "Copy All", then paste into Notes, Email, or a spreadsheet app to save your leads.</p>' +
        '<textarea readonly id="exportTextarea"></textarea>' +
        '<div class="form-actions">' +
          '<button type="button" class="btn btn-secondary" id="exportCloseBtn">Close</button>' +
          '<button type="button" class="btn btn-primary" id="exportCopyBtn">Copy All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    var ta = overlay.querySelector("#exportTextarea");
    ta.value = csv;
    overlay.querySelector("#exportCloseBtn").addEventListener("click", function(){
      document.body.removeChild(overlay);
    });
    overlay.querySelector("#exportCopyBtn").addEventListener("click", function(){
      ta.focus();
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(csv).then(function(){
          alert("Copied to clipboard.");
        }).catch(function(){
          try{ document.execCommand("copy"); alert("Copied to clipboard."); }
          catch(e){ alert("Couldn't copy automatically — the text is selected, copy it manually."); }
        });
      } else {
        try{ document.execCommand("copy"); alert("Copied to clipboard."); }
        catch(e){ alert("Couldn't copy automatically — the text is selected, copy it manually."); }
      }
    });
    setTimeout(function(){ ta.focus(); ta.select(); }, 50);
  }

  function exportLeads(){
    if(leads.length === 0){
      alert("No leads to export yet.");
      return;
    }
    var csv = buildCSV();
    var filename = "socal-leads-" + new Date().toISOString().slice(0,10) + ".csv";

    try {
      var file = new File([csv], filename, { type: "text/csv" });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({ files: [file], title: "SoCal Contractor Exchange Leads Export" }).catch(function(){});
        return;
      }
    } catch(e){}

    try {
      var blob = new Blob([csv], { type: "text/csv" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return;
    } catch(e){}

    showExportFallback(csv);
  }

    var field = group.getAttribute("data-field");
    var value = group.dataset.value === btn.getAttribute("data-value") ? "" : btn.getAttribute("data-value");
    setYesNo(field, value);
  });

  // ---- Follow-up ----
  function digits(p){ return (p||"").replace(/[^0-9+]/g, ""); }
  function buildQuickActions(l){
    var b = [];
    if(l.phone){
      b.push('<a href="tel:' + esc(digits(l.phone)) + '">Call</a>');
      b.push('<a class="alt" href="sms:' + esc(digits(l.phone)) + '">Text</a>');
    }
    if(l.address){
      var app = getMapApp();
      b.push('<div class="map-split"><button type="button" class="map-go" data-map="go">' + (app ? esc(MAP_APPS[app].short) : 'Map') + '</button><button type="button" class="map-pick" data-map="pick" aria-label="Choose map app">&#9662;</button></div>');
    }
    return b.length ? '<div class="quick">' + b.join("") + '</div>' : '';
  }
  function buildFollowUp(l){
    var st = statusOf(l);
    var opts = STATUSES.map(function(x){ return '<option' + (x[0]===st?' selected':'') + '>' + x[0] + '</option>'; }).join("");
    var log = (l.log || []).map(function(e){
      return '<div><b>' + esc(fmtDate(e.ts)) + '</b>' + esc(e.text) + '</div>';
    }).join("");
    return '<div class="fu-box"><h3>Follow-up</h3>' +
      '<div class="fu-grid">' +
        '<div><label>Status</label><select id="fuStatus">' + opts + '</select></div>' +
        '<div><label>Next follow-up</label><input type="date" id="fuNext" value="' + esc(l.next_followup || "") + '"></div>' +
      '</div>' +
      (statusOf(l) === "Sold" ? '<div class="fu-sale"><label>Sold for</label><span class="dollar">$</span><input type="text" inputmode="decimal" id="fuAmount" placeholder="0" value="' + esc(l.sale_amount === undefined || l.sale_amount === "" ? "" : String(l.sale_amount)) + '"></div>' : '') +
      '<div class="fu-btns">' +
        '<button type="button" data-fu="noanswer">No answer \u2192 tomorrow</button>' +
        '<button type="button" data-fu="talked">Talked \u2192 3 days</button>' +
        '<button type="button" data-fu="booked">Booked appt</button>' +
        '<button type="button" data-fu="dead">Not interested</button>' +
        '<button type="button" data-fu="miss">Pitch &amp; miss</button>' +
        '<button type="button" class="sold" data-fu="sold">Sold</button>' +
      '</div>' +
      '<div class="fu-note"><input type="text" id="fuNote" placeholder="Add a note\u2026"><button type="button" data-fu="note">Add</button></div>' +
      (log ? '<div class="fu-log">' + log + '</div>' : '') +
    '</div>';
  }
  function currentLead(){ return leads.find(function(x){ return x.id === viewingId; }); }
  function refreshDetail(){ save(); var y = window.scrollY; openDetail(viewingId); window.scrollTo(0, y); }
  document.getElementById("detailCard").addEventListener("click", function(e){
    var b = e.target.closest("[data-fu]");
    if(!b) return;
    var l = currentLead(); if(!l) return;
    var a = b.getAttribute("data-fu");
    if(a === "noanswer"){ l.status = "No Answer"; l.next_followup = addDaysISO(1); addLog(l, "No answer"); }
    else if(a === "talked"){ l.status = "Contacted"; l.next_followup = addDaysISO(3); addLog(l, "Talked"); }
    else if(a === "booked"){ l.status = "Appt Set"; l.next_followup = ""; addLog(l, "Appointment booked"); refreshDetail(); openEditForm(l.id); setTimeout(function(){ var el=document.getElementById("f_appt_date"); if(el){ el.scrollIntoView({block:"center"}); } }, 80); return; }
    else if(a === "dead"){ l.status = "Not Interested"; l.next_followup = ""; addLog(l, "Not interested"); }
    else if(a === "miss"){ l.status = "Pitch & Miss"; l.next_followup = addDaysISO(30); addLog(l, "Pitched \u2014 no sale"); }
    else if(a === "sold"){ l.status = "Sold"; l.next_followup = ""; addLog(l, "Sold"); refreshDetail(); setTimeout(function(){ var el = document.getElementById("fuAmount"); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } }, 60); return; }
    else if(a === "sent"){ l.status = "Sent to Monday"; addLog(l, "Sent to Monday"); }
    else if(a === "note"){ var n = document.getElementById("fuNote"); var t = n ? n.value.trim() : ""; if(!t) return; addLog(l, t); }
    refreshDetail();
  });
  document.getElementById("detailCard").addEventListener("change", function(e){
    var l = currentLead(); if(!l) return;
    if(e.target.id === "fuStatus"){
      l.status = e.target.value; addLog(l, "Status \u2192 " + l.status);
      if(!isOpen(l)) l.next_followup = "";
      refreshDetail();
    } else if(e.target.id === "fuAmount"){
      l.sale_amount = parseMoney(e.target.value);
      addLog(l, l.sale_amount !== "" ? "Sale amount " + fmtMoney(l.sale_amount) : "Sale amount cleared");
      refreshDetail();
    } else if(e.target.id === "fuNext"){
      l.next_followup = e.target.value; addLog(l, l.next_followup ? "Follow-up set for " + fmtIsoDate(l.next_followup) : "Follow-up cleared");
      refreshDetail();
    }
  });
  document.getElementById("tabs").addEventListener("click", function(e){
    var t = e.target.closest("[data-tab]"); if(!t) return;
    currentTab = t.getAttribute("data-tab"); renderList();
  });

  // ---- Photos (stored on this device in IndexedDB, compressed) ----
  var draftId = null;
  var photoDB = null;
  function openPhotoDB(){
    if(photoDB) return Promise.resolve(photoDB);
    return new Promise(function(res, rej){
      if(!window.indexedDB){ rej(new Error("no idb")); return; }
      var r = indexedDB.open("socal_lead_photos", 1);
      r.onupgradeneeded = function(){
        var st = r.result.createObjectStore("photos", { keyPath: "id" });
        st.createIndex("leadId", "leadId");
      };
      r.onsuccess = function(){ photoDB = r.result; res(photoDB); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function photoTx(mode){ return openPhotoDB().then(function(db){ return db.transaction("photos", mode).objectStore("photos"); }); }
  function photosFor(leadId){
    return photoTx("readonly").then(function(st){
      return new Promise(function(res){
        var q = st.index("leadId").getAll(leadId);
        q.onsuccess = function(){ res((q.result || []).sort(function(a,b){ return a.ts - b.ts; })); };
        q.onerror = function(){ res([]); };
      });
    }).catch(function(){ return []; });
  }
  function photoPut(rec){ return photoTx("readwrite").then(function(st){ return new Promise(function(res, rej){ var q = st.put(rec); q.onsuccess = res; q.onerror = function(){ rej(q.error); }; }); }); }
  function photoDelete(id){ return photoTx("readwrite").then(function(st){ return new Promise(function(res){ var q = st.delete(id); q.onsuccess = res; q.onerror = res; }); }).catch(function(){}); }
  function photoDeleteForLead(leadId){
    return photosFor(leadId).then(function(list){ return Promise.all(list.map(function(p){ return photoDelete(p.id); })); });
  }
  function compressImage(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej(new Error("encode")); }, "image/jpeg", 0.72);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("load")); };
      img.src = url;
    });
  }
  var shownUrls = {};
  function renderPhotos(leadId, gridId, wrapId){
    var grid = document.getElementById(gridId);
    if(!grid) return;
    (shownUrls[gridId] || []).forEach(function(u){ URL.revokeObjectURL(u); });
    shownUrls[gridId] = [];
    grid.innerHTML = "";
    grid.setAttribute("data-lead", leadId);
    photosFor(leadId).then(function(list){
      if(grid.getAttribute("data-lead") !== leadId) return;
      grid.innerHTML = list.map(function(p){
        var u = URL.createObjectURL(p.blob); shownUrls[gridId].push(u);
        return '<img src="' + u + '" data-photo="' + p.id + '" alt="Lead photo">';
      }).join("");
      if(wrapId){ document.getElementById(wrapId).style.display = list.length ? "" : "none"; }
    });
  }
  document.getElementById("photoInput").addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    var leadId = editingId || draftId;
    if(!files.length || !leadId) return;
    var grid = document.getElementById("formPhotos");
    var busy = document.createElement("div"); busy.className = "photo-busy"; busy.textContent = "Saving photo\u2026";
    grid.parentNode.appendChild(busy);
    files.reduce(function(chain, f){
      return chain.then(function(){ return compressImage(f); }).then(function(blob){
        return photoPut({ id: uid(), leadId: leadId, ts: Date.now(), blob: blob });
      });
    }, Promise.resolve()).catch(function(){
      alert("Couldn't save that photo. Try again.");
    }).then(function(){
      busy.remove();
      renderPhotos(leadId, "formPhotos");
    });
  });
  var viewing = null;
  function openViewer(photoId, src, gridId){
    viewing = { id: photoId, grid: gridId };
    document.getElementById("viewerImg").src = src;
    document.getElementById("photoViewer").hidden = false;
  }
  function closeViewer(){ document.getElementById("photoViewer").hidden = true; document.getElementById("viewerImg").removeAttribute("src"); viewing = null; }
  document.addEventListener("click", function(e){
    var im = e.target.closest && e.target.closest("img[data-photo]");
    if(!im) return;
    var grid = im.closest(".photo-grid");
    openViewer(im.getAttribute("data-photo"), im.src, grid.id);
  });
  document.getElementById("viewerClose").addEventListener("click", closeViewer);
  document.getElementById("viewerDelete").addEventListener("click", function(){
    if(!viewing) return;
    var v = viewing;
    photoDelete(v.id).then(function(){
      closeViewer();
      var grid = document.getElementById(v.grid);
      var leadId = grid.getAttribute("data-lead");
      renderPhotos(leadId, v.grid, v.grid === "detailPhotos" ? "detailPhotosWrap" : null);
    });
  });

  // ---- Map app choice ----
  var MAP_KEY = "socal_map_app";
  var MAP_APPS = {
    apple:  { label: "Apple Maps",  short: "Apple",  url: function(a){ return "https://maps.apple.com/?q=" + encodeURIComponent(a); } },
    google: { label: "Google Maps", short: "Google", url: function(a){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a); } },
    waze:   { label: "Waze",        short: "Waze", url: function(a){ return "https://waze.com/ul?q=" + encodeURIComponent(a) + "&navigate=yes"; } }
  };
  function getMapApp(){ try { var v = localStorage.getItem(MAP_KEY); return MAP_APPS[v] ? v : ""; } catch(e){ return ""; } }
  function setMapApp(v){ try { localStorage.setItem(MAP_KEY, v); } catch(e){} }
  function leadAddress(l){ return (l.address || "") + (l.zip ? ", " + l.zip : ""); }
  function openMap(app, l){
    var a = document.createElement("a");
    a.href = MAP_APPS[app].url(leadAddress(l)); a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function showMapSheet(){
    var cur = getMapApp();
    document.getElementById("mapOptions").innerHTML = Object.keys(MAP_APPS).map(function(k){
      return '<button type="button" data-app="' + k + '"' + (k===cur?' class="on"':'') + '>' + MAP_APPS[k].label + (k===cur?'<span class="ck">Default &#10003;</span>':'') + '</button>';
    }).join("");
    document.getElementById("mapSheet").hidden = false;
  }
  function hideMapSheet(){ document.getElementById("mapSheet").hidden = true; }
  document.getElementById("detailCard").addEventListener("click", function(e){
    var b = e.target.closest("[data-map]"); if(!b) return;
    var l = currentLead(); if(!l) return;
    var app = getMapApp();
    if(b.getAttribute("data-map") === "go" && app){ openMap(app, l); }
    else { showMapSheet(); }
  });
  document.getElementById("mapOptions").addEventListener("click", function(e){
    var b = e.target.closest("[data-app]"); if(!b) return;
    var app = b.getAttribute("data-app");
    setMapApp(app); hideMapSheet();
    var l = currentLead(); if(l){ openMap(app, l); refreshDetail(); }
  });
  document.getElementById("mapCancel").addEventListener("click", hideMapSheet);
  document.getElementById("mapSheet").addEventListener("click", function(e){ if(e.target.id === "mapSheet") hideMapSheet(); });

  load();
  renderList();
})();
</script>
</body>
</html>
