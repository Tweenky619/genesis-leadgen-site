<style>
:root{
  --bg:#15110a; --bg2:#1e180d; --card:#241d10; --line:rgba(212,175,55,.18);
  --gold:#d4af37; --gold2:#f1d78a; --text:#f4ecd8; --mute:#b8a98a; --green:#7fbf7a; --blue:#8fb3d9; --red:#e0907e;
  --border:rgba(212,175,55,.3); --brand:#d4af37;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1f1809,#15110a);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px}
header .t{flex:1;min-width:0}
header h1{font-size:17px;font-weight:700}
header p{font-size:12px;color:var(--mute)}
.hb{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:rgba(212,175,55,.08);color:var(--gold);display:grid;place-items:center;flex:none}
.hb.add{border-color:var(--gold);background:rgba(212,175,55,.14)}
main{padding:12px 14px 0}
.view{display:none}.view.on{display:block}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:12px;text-transform:none;letter-spacing:0;color:var(--gold2);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:20px;color:var(--gold2)}
.stat span{font-size:11px;color:var(--mute)}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;outline:none}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-weight:600;font-size:12.5px;padding:7px 6px;border-radius:9px;white-space:nowrap}
.seg button.on{background:rgba(212,175,55,.18);color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.card.tap{cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e3a1,#b88a1c);color:#2a1f05;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.av.sq{border-radius:10px;background:rgba(212,175,55,.14);color:var(--gold);font-size:9px;letter-spacing:.5px}
.grow{flex:1;min-width:0}
.nm{font-weight:650}
.sub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{white-space:normal}
.r{text-align:right;flex:none}
.r b{color:var(--gold2);font-size:15px}
.r small{display:block;font-size:11px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(212,175,55,.1);color:var(--gold2)}
.chip.ok{background:rgba(127,191,122,.14);color:var(--green)}.chip.warn{background:rgba(224,144,126,.14);color:var(--red)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid currentColor}
.p-Prospect{color:var(--mute)}.p-Pitched{color:var(--blue)}.p-Onboarded{color:var(--gold)}.p-Active{color:var(--green)}.p-Paused{color:var(--red)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:4px}
.t-out{background:rgba(143,179,217,.15);color:var(--blue)}.t-in{background:rgba(127,191,122,.15);color:var(--green)}.t-barter{background:rgba(212,175,55,.15);color:var(--gold2)}
.t-flag{background:rgba(224,144,126,.18);color:var(--red)}
.note{font-size:12.5px;color:var(--mute);background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:10px;margin:8px 0}
.note b{color:var(--gold2)}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:22px 10px}
.btn{border:1px solid var(--gold);background:rgba(212,175,55,.12);color:var(--gold2);font-weight:600;font-size:13px;border-radius:10px;padding:8px 12px;flex:none}
.btn.solid{background:var(--gold);color:#1e1606;border-color:var(--gold)}
.btn.ghost{border-color:var(--line);background:none;color:var(--mute)}
.btn.danger{border-color:rgba(224,144,126,.5);color:var(--red);background:none}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rate{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#3a2c0c,#241d10);border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:10px}
.rate span{font-size:11px;color:var(--mute);display:block}.rate b{font-size:24px;color:var(--gold2);display:block}.rate small{font-size:11px;color:var(--mute)}
.rate.stale{border-color:var(--red)}
.row2{display:flex;justify-content:space-between;font-size:13px;gap:10px}.row2 b{color:var(--gold2)}
.bar-w{height:6px;background:var(--bg2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar-w i{display:block;height:100%;background:linear-gradient(90deg,#b88a1c,#f1d78a)}
.ser{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sh{display:flex;justify-content:space-between;margin-bottom:7px}.sh span{color:var(--gold2);font-weight:700}
.dn{display:flex;flex-wrap:wrap;gap:5px}.dn i{font-style:normal;font-size:12px;color:var(--mute);background:var(--bg2);border-radius:7px;padding:3px 7px}.dn i b{color:var(--text)}
.dn i.low{color:var(--red);background:rgba(224,144,126,.12)}.dn i.low b{color:var(--red)}
.ev{display:flex;gap:12px;align-items:center}
.date{width:46px;flex:none;text-align:center;border:1px solid var(--gold);border-radius:10px;padding:4px 0}
.date b{display:block;font-size:18px;color:var(--gold2);line-height:1.1}
.date span{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(21,17,10,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:var(--mute);font-weight:600;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;position:relative}
nav button.on{color:var(--gold2)}
nav button .dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#1e1606;font-size:10px;line-height:16px;padding:0 4px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#1c160b;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;color:var(--mute);font-size:24px;line-height:1;padding:0 4px}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.in,select.in,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
textarea.in{min-height:70px;resize:vertical}
.in:focus{border-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg2);color:var(--mute);border-radius:20px;padding:6px 11px;font-size:13px}
.opts button.on{border-color:var(--gold);background:rgba(212,175,55,.18);color:var(--gold2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.items .it{display:grid;grid-template-columns:1.4fr .9fr .8fr auto;gap:6px;margin-bottom:6px;align-items:center}
.sum{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.sum .row2{margin:3px 0}
.flag{background:rgba(224,144,126,.12);border:1px solid rgba(224,144,126,.45);color:var(--red);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.log{font-size:12px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;margin-top:6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:#2c2310;border:1px solid var(--gold);color:var(--gold2);padding:11px 14px;border-radius:12px;font-weight:600;z-index:40;text-align:center}
.step{display:flex;gap:8px;font-size:12.5px;padding:4px 0;color:var(--mute)}.step.now{color:var(--gold2)}.step.done{text-decoration:line-through;opacity:.6}
details.ob{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;padding:10px 12px}
details.ob summary{font-weight:650;cursor:pointer;color:var(--text)}
details.ob[open] summary{color:var(--gold2);margin-bottom:6px}
details.ob div{font-size:14px}
/* cloud backup box from sync.js */
#syncBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--mute)}
#syncBox b{color:var(--gold2)}
#syncBox button{display:block;width:100%;margin-top:6px;border-radius:10px;padding:9px;font-weight:600;border:1px solid var(--line)!important;background:var(--bg2)!important;color:var(--gold2)!important}
#syncCodeShow{color:var(--gold2)}
</style>
</head>
<body>
<header>
  <img src="/goldenbee-gb-logo.png" alt="">
  <div class="t"><h1 id="title">Members</h1><p>Goldenbee MALAJ · Goldbacks</p></div>
  <button class="hb" id="connBtn" aria-label="Connections and settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>

<nav id="nav">

</nav>

<div id="backupSheet" style="display:none"><div class="sheet" style="background:none;border:0;padding:0;max-height:none;overflow:visible"><h3 id="backupTitle" style="display:none"></h3></div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
"use strict";
// ================= storage =================
var P = "gb_";
var K = { members: P+"members_v1", merchants: P+"merchants_v1", exchanges: P+"exchanges_v1", inventory: P+"inventory_v1", events: P+"events_v1", settings: P+"settings_v1", mig: P+"mig_done_v1" };
function jget(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function jset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast("Storage is full. Nothing new could be saved."); } }
var D = {};
function load(){
  D.members = jget(K.members, []); D.merchants = jget(K.merchants, []); D.exchanges = jget(K.exchanges, []);
  D.inventory = jget(K.inventory, null); D.events = jget(K.events, []); D.settings = jget(K.settings, {});
  if (!Array.isArray(D.inventory) || !D.inventory.length) D.inventory = defaultInventory();
  var s = D.settings;
  if (!s.review) s.review = "https://g.page/r/CdyNEy4nzc_kEBM/review";
  if (!s.youtube) s.youtube = "@goldenbeemalajjewelry";
  if (s.rate == null) s.rate = 10;
  if (!s.show) s.show = { rate: true, merchants: true, events: true, videos: true };
  if (s.tax == null) s.tax = 7.75;
  if (s.floor == null) s.floor = 8.75;
}
function save(which){ (which ? [which] : ["members","merchants","exchanges","inventory","events","settings"]).forEach(function(w){ jset(K[w], D[w]); }); if (!which || /merchants|events|settings/.test(which)) publishSoon(); }

var DEN = { orig: ["1","5","10","25","50"], ut26: ["¼","½","1","2","5","10","25","50"], new8: ["½","1","2","5","10","25","50","100"], all9: ["¼","½","1","2","5","10","25","50","100"] };
function dval(d){ return d === "¼" ? 0.25 : d === "½" ? 0.5 : parseFloat(d); }
function defaultInventory(){
  var L = [["utah","Utah",DEN.orig],["utah26","Utah 2026",DEN.ut26],["nevada","Nevada",DEN.orig],["nh","New Hampshire",DEN.orig],["wyoming","Wyoming",DEN.orig],["sd","South Dakota",DEN.orig],["florida","Florida",DEN.all9],["oklahoma","Oklahoma",DEN.new8],["arizona","Arizona",DEN.new8],["idaho","Idaho",DEN.all9]];
  return L.map(function(x){ var c = {}; x[2].forEach(function(d){ c[d] = 0; }); return { id: x[0], name: x[1], counts: c, min: 2, alpha: false }; });
}
function uid(p){ return (p||"") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(iso, n){ var p = iso.split("-"), d = new Date(+p[0], +p[1]-1, +p[2] + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(n){ n = Number(n) || 0; return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function money0(n){ return "$" + Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function gbFmt(n){ n = Math.round((Number(n)||0)*100)/100; return (n % 1 ? n.toFixed(2).replace(/0$/,"") : String(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function initials(n){ var p = String(n||"?").trim().split(/\s+/); return ((p[0]||"?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
function first(n){ return String(n||"").trim().split(/\s+/)[0] || "there"; }
function fmtDate(iso){ if (!iso) return ""; var p = iso.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function ago(ts){ if (!ts) return ""; var days = Math.floor((Date.now() - ts) / 864e5); return days <= 0 ? "Today" : days === 1 ? "Yesterday" : days < 7 ? days + " days ago" : days < 14 ? "1 week ago" : days < 60 ? Math.floor(days/7) + " weeks ago" : Math.floor(days/30) + " months ago"; }
function digits(x){ return String(x||"").replace(/\D/g, ""); }
function smsLink(phone, body){ var n = digits(phone); var sep = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? "&" : "?"; return "sms:" + (n ? (n.length === 10 ? "+1" + n : "+" + n) : "") + sep + "body=" + encodeURIComponent(body); }
function toast(m){ var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2800); }
function copy(text, msg){ try{ navigator.clipboard.writeText(text).then(function(){ toast(msg || "Copied"); }, function(){ prompt("Copy this:", text); }); }catch(e){ prompt("Copy this:", text); } }

// ================= migration from the old Goldback app =================
function migrate(){
  var done = jget(K.mig, []), old = jget(P + "leads_v1", []), seen = {}, n = 0;
  done.forEach(function(id){ seen[id] = 1; });
  if (!Array.isArray(old)) return 0;
  old.forEach(function(l){
    if (!l || !l.id || seen[l.id]) return;
    var nm = l.homeowner_name || [l.first_name, l.last_name].filter(Boolean).join(" ") || "Unnamed";
    var ints = (l.interests || []).join(" ");
    var isMerchant = /merchant|accept goldbacks/i.test(ints) || /merchant/i.test(l.source || "");
    var notes = [l.notes, l.web_summary].filter(Boolean).join("\n");
    var log = (l.log || []).map(function(x){ return typeof x === "string" ? { ts: Date.now(), t: x } : { ts: x.ts || x.time || Date.now(), t: x.text || x.t || x.note || "" }; }).filter(function(x){ return x.t; });
    if (isMerchant){
      D.merchants.push({ id: "mo_" + l.id, name: l.business || nm, contact: nm, phone: l.phone || "", email: l.email || "", address: l.address || "", kind: "", area: "", stage: "Prospect", option: "", agreement: "", listed: false, next: l.next_followup || "", notes: notes, log: log, created: l.created_at || Date.now(), updated: Date.now() });
    } else {
      D.members.push({ id: "mo_" + l.id, name: nm, phone: l.phone || "", email: l.email || "", address: l.address || "", kind: /collector|state set/i.test(ints) ? "Collector" : "Saver", states: [], prefers: "", contact: "Text", referred: "", review: "", credit: 0, status: /sold|customer|won/i.test(l.status || "") ? "Customer" : (l.status === "Cold" ? "Cold" : "Following up"), next: l.next_followup || "", web_new: !!l.web_new, source: l.source || "", plan: l.gb_stage || 0, plan_start: l.gb_date || "", notes: notes, log: log, created: l.created_at || Date.now(), updated: Date.now() });
    }
    done.push(l.id); n++;
  });
  if (n){ jset(K.mig, done); save("members"); save("merchants"); }
  return n;
}

// ================= state + nav =================
var view = "members", filt = { members: "All", merchants: "All", exchanges: "month" }, q = { members: "", merchants: "" };
var TITLES = { members: "Members", merchants: "Merchants", exchanges: "Exchanges", inventory: "Inventory", community: "Community", connections: "Connections" };
function go(v){
  view = v;
  document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === v); });
  document.querySelectorAll(".view").forEach(function(s){ s.classList.toggle("on", s.id === "v-" + v); });
  document.getElementById("title").textContent = TITLES[v];
  document.getElementById("addBtn").style.visibility = v === "connections" ? "hidden" : "visible";
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach(function(b){ b.onclick = function(){ go(b.dataset.v); }; });
document.getElementById("connBtn").onclick = function(){ go(view === "connections" ? "members" : "connections"); };
document.getElementById("addBtn").onclick = function(){
  if (view === "members") editMember(); else if (view === "merchants") editMerchant(); else if (view === "exchanges") editExchange();
  else if (view === "inventory") editSeries(); else if (view === "community") addCommunity();
};
function render(){
  ({ members: rMembers, merchants: rMerchants, exchanges: rExchanges, inventory: rInventory, community: rCommunity, connections: rConnections })[view]();
  var due = D.members.filter(isDue).length;
  var b = document.querySelector('#nav button[data-v="members"]'), d = b.querySelector(".dot");
  if (due){ if (!d){ d = document.createElement("span"); d.className = "dot"; b.appendChild(d); } d.textContent = due; } else if (d) d.remove();

// ================= EXCHANGES =================
// Owner's rule: never exchange out below Goldback's daily rate; retail steps up $5 when the daily rate passes $10, $15, $20...; $2,000+ always at the daily rate
function stepPrice(){ var d = PUB.daily || 0; return d ? Math.max(10, Math.ceil(d / 5 - 1e-9) * 5) : 0; }
function exemptLine(){ return Number(D.settings.exempt) || 2000; }
function unlockQty(){ var d = PUB.daily || 0; return d ? Math.ceil(2000 / d - 1e-9) : 0; }
// Tier ladder: each tier closes part of the gap between the $5 step price and the daily rate
function ladderPrice(gb){
  var d = PUB.daily || 0; if (!d) return retailRate();
  var U = unlockQty(); if (gb >= U) return d;
  var f = [1, 0.85, 0.70, 0.55][Math.min(3, Math.floor(gb * d / 500))]; // four tiers, about $500 each at the daily rate
  var p = Math.round((d + f * (stepPrice() - d)) * 100) / 100;
  var cap = Math.min(U * d, 1999.99); // cap: no order reaches $2,000 without the daily rate
  if (gb > 0 && gb * p > cap) p = Math.floor(cap / gb * 100) / 100;
  return Math.max(p, d);
}
function floorPrice(price, gb){
  var d = PUB.daily || 0; if (!d) return price;
  var U = unlockQty(); if (gb >= U) return d;
  var cap = Math.min(U * d, 1999.99);
  if (gb > 0 && gb * price > cap) price = Math.floor(cap / gb * 100) / 100;
  return Math.max(price, d);
}
function retailRate(){ return Math.max(D.settings.rate || 0, stepPrice()); }
function exGB(x){ return (x.items || []).reduce(function(s, it){ return s + dval(it.d) * (it.q || 0); }, 0); }
function exSub(x){ return x.dir === "barter" ? (Number(x.value) || exGB(x) * (x.price || 0)) : exGB(x) * (x.price || 0); }
function exTax(x){ return x.dir === "out" && x.taxed ? Math.round(exSub(x) * (x.taxRate || 0)) / 100 : 0; }
function exTotal(x){ return exSub(x) + exTax(x); }
function whoName(id){ var r = byId(D.members, id) || byId(D.merchants, id); return r ? r.name : ""; }
function exFlags(x){
  var f = [];
  if (x.pay === "Cash" && x.dir !== "barter"){
    var t = new Date(x.date).getTime(), sum = 0;
    D.exchanges.forEach(function(o){ if (o.pay === "Cash" && o.dir !== "barter" && o.who && o.who === x.who && Math.abs(new Date(o.date).getTime() - t) <= 864e5 * 1) sum += exTotal(o); });
    if (exTotal(x) > 10000) f.push("Cash over $10,000: file Form 8300 within 15 days.");
    else if (sum > 10000) f.push("Related cash from this person tops $10,000 within a day: Form 8300 may be required. Never split a sale to avoid reporting.");
  }
  return f;
}
function yearTotals(){ var y = String(new Date().getFullYear()), o = 0, i = 0; D.exchanges.forEach(function(x){ if (String(x.date).slice(0,4) !== y) return; if (x.dir === "in") i += exSub(x); else o += exSub(x); }); return { out: o, in: i }; }
function exCard(x){
  var g = exGB(x), lab = x.dir === "out" ? "Exchanged out" : x.dir === "in" ? "Exchanged in" : "Barter", cls = "t-" + x.dir;
  var flags = exFlags(x);
  var series = {}; (x.items||[]).forEach(function(it){ (series[it.s] = series[it.s] || []).push(it.q + "×" + it.d); });
  var line1 = Object.keys(series).map(function(s){ var r = byId(D.inventory, s); return (r ? r.name : s) + " · " + series[s].join(", "); }).join(" | ") + " · " + gbFmt(g) + " GB";
  var line2 = x.dir === "out" ? money(exSub(x)) + (x.taxed ? " + " + x.taxRate + "% tax " + money(exTax(x)) : " no tax") + " · " + (x.pay || "") : x.dir === "in" ? (x.pay || "") + (x.credit ? " · " + money(x.credit) + " credit left open" : "") : (x.forWhat ? "for " + x.forWhat + " · " : "") + "fair value recorded";
  if (x.receipt) line2 += " · receipt sent";
  return '<div class="card tap" data-x="' + x.id + '"><div class="grow"><div class="nm">' + esc(whoName(x.who) || x.whoName || "Walk-in") + ' <span class="tag ' + cls + '">' + lab + '</span>' + (flags.length ? '<span class="tag t-flag">Check</span>' : "") + '</div><div class="sub">' + esc(line1) + '</div><div class="sub">' + esc(line2) + '</div></div><div class="r"><b>' + money(exTotal(x)) + '</b><small>' + esc(fmtDate(x.date)) + '</small></div></div>';
}

    '<h2>Where to spend</h2><div class="note"><b>' + D.merchants.filter(function(b){ return b.stage === "Active"; }).length + ' local businesses</b> accept Goldbacks. <a href="#" id="cSpend" style="color:var(--gold2)">Copy the list</a> to share with members.</div>';
  document.getElementById("cRel").onclick = function(e){ e.preventDefault(); editEvent(null, "release"); };
  document.getElementById("cEv").onclick = function(e){ e.preventDefault(); editEvent(null, "event"); };
  el.querySelectorAll("[data-ev]").forEach(function(c){ c.onclick = function(){ editEvent(c.dataset.ev); }; });
  el.querySelectorAll("[data-rel]").forEach(function(b){ var r = byId(D.events, b.dataset.rel); b.onclick = function(){ textList(r.title, "Hi {name}, it's Art from Goldenbee MALAJ. " + (r.msg || ("The " + r.title + " Goldbacks just came out. Want me to set some aside for you?")), audience(r)); }; });
  el.querySelectorAll("[data-vid]").forEach(function(b){ var v = vids[+b.dataset.vid]; b.onclick = function(){ textList(v.title, "Hi {name}, it's Art from Goldenbee MALAJ. Thought you'd like this: " + v.title + " " + v.link, D.members.concat(D.merchants.filter(function(m){ return m.stage !== "Prospect"; })).filter(function(p){ return p.phone; })); }; });
  document.getElementById("cSpend").onclick = function(e){ e.preventDefault(); var L = D.merchants.filter(function(b){ return b.stage === "Active"; }).map(function(b){ return "- " + b.name + (b.area ? " (" + b.area + ")" : ""); }).join("\n"); copy("Places in San Diego that accept Goldbacks:\n" + L + "\nMore at goldenbeemalaj.com", "List copied"); };
}
function addCommunity(){ openSheet(head("Add") + '<div class="btns"><button class="btn solid" id="aEv">Class or meetup</button><button class="btn solid" id="aRel">New release to share</button></div>'); document.getElementById("aEv").onclick = function(){ editEvent(null, "event"); }; document.getElementById("aRel").onclick = function(){ editEvent(null, "release"); }; }
function audience(r){ var L = D.members.filter(function(m){ return m.phone && m.status !== "Cold"; }); if (r.aud === "Collectors") L = L.filter(function(m){ return m.kind === "Collector"; }); if (r.aud === "Savers") L = L.filter(function(m){ return m.kind !== "Collector"; }); if (r.state) { var both = L.filter(function(m){ return (m.states||[]).indexOf(r.state) !== -1; }); if (both.length) L = both; } return L; }
function textList(title, tpl, people){
  openSheet(head("Text: " + title) + '<div class="note">Tap each person to open a text with the message filled in. Tapped names turn green.</div>' +
    (people.length ? people.map(function(p, i){ return '<div class="card"><div class="av">' + esc(initials(p.name)) + '</div><div class="grow"><div class="nm">' + esc(p.name) + '</div><div class="sub">' + esc(p.phone) + '</div></div><a class="btn" data-t="' + i + '" href="' + esc(smsLink(p.phone, tpl.replace("{name}", first(p.contact || p.name)))) + '">Text</a></div>'; }).join("") : '<div class="empty">No one with a phone number in this group yet.</div>'));
  sh.querySelectorAll("[data-t]").forEach(function(a){ a.addEventListener("click", function(){ a.textContent = "Sent"; a.classList.add("ghost"); var p = people[+a.dataset.t]; addLog(p, "Texted: " + title); p.updated = Date.now(); setTimeout(function(){ save("members"); save("merchants"); }, 50); }); });
}
function editEvent(id, kind){
  var e = id ? byId(D.events, id) : { kind: kind, date: todayISO(), web: true, aud: "All" };
  var isRel = e.kind === "release";
  openSheet(head(isRel ? (id ? "Release" : "New release") : (id ? "Event" : "New class or meetup")) +
    fld(isRel ? "What came out" : "Title", "eT", e.title, "text", isRel ? "e.g. Florida ¼ Alpha" : "e.g. Sound Money 101") +
    (isRel ? opts("Who to text", "eA", ["All","Collectors","Savers"], e.aud) + opts("Only people who collect (optional)", "eS", STATES, e.state) + area("Message (optional)", "eM", e.msg)
      : '<div class="two"><div>' + fld("Date", "eD", e.date, "date") + '</div><div>' + fld("Time", "eTi", e.time, "text", "6 pm") + '</div></div>' + fld("Place", "eP", e.place) + area("Short description", "eDe", e.desc) + fld("RSVPs so far", "eR", e.rsvp || 0, "number") + opts("Show on goldenbeemalaj.com", "eW", ["Yes"], e.web ? "Yes" : "")) +
    '<div class="btns"><button class="btn solid" id="eSave">Save</button>' + (!isRel && id ? '<button class="btn" id="eGoogle">Google post</button>' : "") + (id ? '<button class="btn danger" id="eDel">Delete</button>' : "") + '</div>');
  bindOpts();
  document.getElementById("eSave").onclick = function(){
    var t = val("eT"); if (!t){ toast("Add a title."); return; }
    var rec = id ? e : { id: uid("e_"), kind: e.kind, created: Date.now() };
    rec.title = t;
    if (isRel){ rec.aud = optVal("eA") || "All"; rec.state = optVal("eS"); rec.msg = val("eM"); }
    else { rec.date = val("eD") || todayISO(); rec.time = val("eTi"); rec.place = val("eP"); rec.desc = val("eDe"); rec.rsvp = num("eR"); rec.web = !!optVal("eW"); }
    if (!id) D.events.push(rec);
    save("events"); closeSheet(); render();
  };
  var g = document.getElementById("eGoogle"); if (g) g.onclick = function(){ copy(googlePost(e), "Post copied. Paste it in your Google Business Profile."); };
  var d = document.getElementById("eDel"); if (d) d.onclick = function(){ if (!confirm("Delete this?")) return; D.events = D.events.filter(function(x){ return x.id !== id; }); save("events"); closeSheet(); render(); };
}
function googlePost(e){ return e.title + (e.date ? " · " + fmtDate(e.date) + (e.time ? ", " + e.time : "") : "") + "\n" + (e.desc || "Free and open to the community.") + (e.place ? "\nWhere: " + e.place : "") + "\nRSVP at goldenbeemalaj.com or call (619) 504-8977."; }

// ================= CONNECTIONS =================
function rConnections(){
  var el = document.getElementById("v-connections"), s = D.settings, sw = s.show;
  var bk = document.getElementById("backupSheet"); document.body.appendChild(bk); bk.style.display = "none";
  var listed = D.merchants.filter(function(b){ return b.listed && b.stage === "Active"; }).length, act = D.merchants.filter(function(b){ return b.stage === "Active"; }).length;
  var key = localStorage.getItem("gb_inq_key") || "";
  var nextEv = D.events.filter(function(e){ return e.kind !== "release" && e.date >= todayISO(); }).sort(function(a, b){ return a.date < b.date ? -1 : 1; })[0];
  el.innerHTML = '<h2>Connected</h2>' +
    '<div class="card"><div class="av sq">WEB</div><div class="grow"><div class="nm">goldenbeemalaj.com</div><div class="sub wrap">' + (key ? (PUB.lastPub ? "Last sent " + ago(PUB.lastPub).toLowerCase() : "Rate, merchants, classes, Get Started form") : "Needs your access key to connect") + '</div></div><span class="pill ' + (key ? "p-Active" : "p-Paused") + '">' + (key ? "On" : "Off") + '</span></div>' +
    '<div class="card"><div class="av sq">G</div><div class="grow"><div class="nm">Google Business Profile</div><div class="sub">Review link saved · posts ready to paste</div></div><span class="pill p-Active">On</span></div>' +
    '<div class="card"><div class="av sq">YT</div><div class="grow"><div class="nm">YouTube</div><div class="sub">' + esc(s.youtube) + ' · ' + (PUB.videos && PUB.videos.length ? PUB.videos.length + " newest videos" : "newest videos") + '</div></div><span class="pill p-Active">On</span></div>' +
    (key ? "" : '<div class="card" style="display:block"><div class="nm">Connect the website</div><div class="sub wrap">Enter the website access key once. It also pulls website form requests and orders into Members.</div><input class="in" id="kIn" type="password" placeholder="Access key" style="margin-top:8px"><div class="btns"><button class="btn solid" id="kSave">Connect</button></div></div>') +
    '<h2>Show on website</h2><div class="card" style="display:block">' +
      tog("rate", "Today's rate", money(s.rate)) + tog("merchants", "Merchants (agreed to be listed)", listed + " of " + act) + tog("events", "Classes and meetups", "") + tog("videos", "Newest YouTube videos", "") +
      (key ? '<div class="btns"><button class="btn" id="pubNow">Send to website now</button></div>' : "") + '</div>' +
    '<h2>Website requests</h2><div class="card" style="display:block"><div class="sub wrap">' + (key ? "New form requests and orders show up in Members with a Website tag, and you get the 7-step follow-up plan." : "Connect the website above.") + '</div>' + (key ? '<div class="btns"><button class="btn" id="inqNow">Check now</button></div>' : "") + '<div class="sub wrap" id="inqMsg" style="margin-top:6px"></div></div>' +
    '<h2>Google Business Profile</h2><div class="card" style="display:block">' + fld("Review link", "gRev", s.review, "url") +
      '<div class="btns"><button class="btn" id="gSaveRev">Save link</button><a class="btn ghost" target="_blank" rel="noopener" href="https://business.google.com/">Open profile</a></div>' +
      (nextEv ? '<div class="sub wrap" style="margin-top:10px"><b style="color:var(--gold2)">Ready to post:</b> ' + esc(googlePost(nextEv)).replace(/\n/g, "<br>") + '</div><div class="btns"><button class="btn" id="gCopy">Copy post</button></div>' : '<div class="sub wrap" style="margin-top:8px">Add a class or meetup in Community and its Google post shows up here.</div>') + '</div>' +
    '<h2>YouTube</h2><div class="card" style="display:block">' + fld("Channel", "yCh", s.youtube, "text", "@yourchannel") + '<div class="btns"><button class="btn" id="ySave">Save</button></div></div>' +
    '<h2>Cloud backup</h2><div id="bkSlot"></div>' +
    '<div class="note">Old Goldback app data was copied in: ' + jget(K.mig, []).length + ' records. Nothing was deleted.</div>';
  el.querySelectorAll("[data-tog]").forEach(function(b){ b.onclick = function(){ sw[b.dataset.tog] = !sw[b.dataset.tog]; save("settings"); rConnections(); }; });
  var b;
  if ((b = document.getElementById("kSave"))) b.onclick = function(){ var v = val("kIn"); if (!v) return; try{ localStorage.setItem("gb_inq_key", v); }catch(e){} inqSync(true); publishNow(); rConnections(); };
  if ((b = document.getElementById("pubNow"))) b.onclick = function(){ publishNow(true); };
  if ((b = document.getElementById("inqNow"))) b.onclick = function(){ inqSync(true); };
  if ((b = document.getElementById("gSaveRev"))) b.onclick = function(){ var v = val("gRev"); if (!/^https:\/\//.test(v)){ toast("That doesn't look like a link."); return; } s.review = v; save("settings"); toast("Review link saved"); };
  if ((b = document.getElementById("gCopy"))) b.onclick = function(){ copy(googlePost(nextEv), "Post copied. Paste it in your Google Business Profile."); };
  if ((b = document.getElementById("ySave"))) b.onclick = function(){ s.youtube = val("yCh") || s.youtube; save("settings"); loadPublic(); toast("Saved"); };
  var slot = document.getElementById("bkSlot"); if (slot){ slot.appendChild(bk); bk.style.display = ""; }
}
function tog(k, label, extra){ var on = D.settings.show[k]; return '<div class="row2" style="align-items:center;margin:6px 0"><span>' + esc(label) + (extra ? ' <small style="color:var(--mute)">' + esc(extra) + '</small>' : "") + '</span><button class="btn ' + (on ? "" : "ghost") + '" data-tog="' + k + '" style="min-width:58px">' + (on ? "On" : "Off") + '</button></div>'; }

// ================= website: publish + public data + inquiries =================
var pubT = null;
function publishSoon(){ clearTimeout(pubT); pubT = setTimeout(publishNow, 3000); }
function publicPayload(){
  var s = D.settings, sw = s.show;
  return {
    rate: sw.rate ? { price: retailRate(), date: s.rate_date || "" } : null,
    merchants: sw.merchants ? D.merchants.filter(function(b){ return b.listed && b.stage === "Active"; }).map(function(b){ return { name: b.name, kind: b.kind || "", area: b.area || "", address: b.address || "", option: b.option || "" }; }) : [],
    events: sw.events ? D.events.filter(function(e){ return e.kind !== "release" && e.web && e.date >= todayISO(); }).map(function(e){ return { id: e.id, title: e.title, date: e.date, time: e.time || "", place: e.place || "", desc: e.desc || "" }; }) : [],
    videos: !!sw.videos, youtube: s.youtube, review: s.review
  };
}
function publishNow(loud){
  var key = localStorage.getItem("gb_inq_key"); if (!key || !navigator.onLine) return;
  fetch("/api/gb-publish", { method: "POST", headers: { "Content-Type": "application/json", "x-gb-key": key }, body: JSON.stringify(publicPayload()) })
    .then(function(r){ if (r.status === 401){ try{ localStorage.removeItem("gb_inq_key"); }catch(e){} throw new Error("key"); } if (!r.ok) throw new Error("net"); PUB.lastPub = Date.now(); if (loud) toast("Sent to the website"); if (view === "connections") rConnections(); })
    .catch(function(e){ if (loud) toast(e.message === "key" ? "Wrong access key. Enter it again." : "Couldn't reach the website. Try again later."); });
}
function loadPublic(){
  fetch("/api/gb-public?yt=" + encodeURIComponent(D.settings.youtube || ""), { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(j){ PUB.videos = j.videos || []; PUB.daily = Number(j.daily) || 0; PUB.err = false; if (view === "community" || view === "connections") render(); })
    .catch(function(){ PUB.err = true; if (view === "community") render(); });
}
function inqSync(loud){
  var key = localStorage.getItem("gb_inq_key"); if (!key) return;
  var since = parseInt(localStorage.getItem("gb_inq_since") || "0", 10) || 0, os = parseInt(localStorage.getItem("gb_inq_osince") || "0", 10) || 0;
  var msg = function(t){ var m = document.getElementById("inqMsg"); if (m) m.textContent = t; if (loud) toast(t); };
  fetch("/api/gb-inquiries?since=" + since + "&osince=" + os, { headers: { "x-gb-key": key }, cache: "no-store" }).then(function(r){
    if (r.status === 401){ try{ localStorage.removeItem("gb_inq_key"); }catch(e){} throw new Error("Wrong access key. Enter it again."); }
    if (!r.ok) throw new Error("Couldn't reach the website.");
    return r.json();
  }).then(function(j){
    var added = 0, maxId = since, omax = os;
    (j.leads || []).forEach(function(w){
      if (w.id > maxId) maxId = w.id;
      if (D.members.some(function(m){ return m.web_id === w.id; }) || D.merchants.some(function(m){ return m.web_id === w.id; })) return;
      var c = String(w.contact || ""), em = c.indexOf("@") !== -1, phone = em ? "" : c, email = em ? c : "";
      var interest = String(w.interest || "General question"), note = "Website request: " + interest + (w.best_time ? " · best time " + w.best_time : "");
      var dup = phone ? D.members.filter(function(m){ return digits(m.phone).slice(-10) && digits(m.phone).slice(-10) === digits(phone).slice(-10); })[0] : null;
      if (dup){ dup.web_id = w.id; dup.web_new = true; addLog(dup, note); dup.updated = Date.now(); added++; return; }
      var nm = String(w.name || "Website visitor").trim().replace(/\s+/g, " ").replace(/(^|[\s-])([a-z])/g, function(m, a, b){ return a + b.toUpperCase(); });
      if (/merchant|business|accept/i.test(interest)){
        var b = { id: uid("b_"), web_id: w.id, name: nm + " (business)", contact: nm, phone: phone, email: email, stage: "Prospect", next: todayISO(), notes: note, log: [], created: Date.now(), updated: Date.now() };
        addLog(b, note); D.merchants.push(b);
      } else {
        var m = { id: uid("m_"), web_id: w.id, web_new: true, name: nm, phone: phone, email: email, kind: /collect|state set|full set/i.test(interest) ? "Collector" : "Starter", status: "Following up", contact: phone ? "Text" : "Email", states: [], source: "Website", plan: 0, plan_start: todayISO(), next: todayISO(), notes: note, log: [], review: "", credit: 0, created: Date.now(), updated: Date.now() };
        addLog(m, note); D.members.push(m);
      }
      added++;
    });
    (j.orders || []).forEach(function(o){
      if (o.id > omax) omax = o.id;
      if (D.members.some(function(m){ return m.web_order_id === o.id; })) return;
      var sum = "Website order #" + o.id + ": " + (o.quantity || 1) + " × " + (o.denomination || "") + " " + (o.series || "") + " · " + money((o.amount_cents || 0) / 100) + " paid" + (o.shipping_address ? " · ship to " + o.shipping_address : "");
      var em2 = String(o.customer_email || "").toLowerCase(), dup2 = em2 ? D.members.filter(function(m){ return (m.email || "").toLowerCase() === em2; })[0] : null;
      if (dup2){ dup2.web_order_id = o.id; dup2.web_new = true; addLog(dup2, sum); dup2.updated = Date.now(); added++; return; }
      var m2 = { id: uid("m_"), web_order_id: o.id, web_new: true, name: o.customer_name || "Website customer", email: o.customer_email || "", phone: "", address: o.shipping_address || "", kind: "Saver", status: "Customer", contact: "Email", states: [], source: "Website order", notes: sum, log: [], review: "", credit: 0, next: todayISO(), created: Date.now(), updated: Date.now() };
      addLog(m2, sum); D.members.push(m2); added++;
    });
    try{ localStorage.setItem("gb_inq_since", String(maxId)); localStorage.setItem("gb_inq_osince", String(omax)); }catch(e){}
    if (added){ save("members"); save("merchants"); render(); }
    msg(added ? added + " new from the website. Look for the Website tag in Members." : "No new website requests.");
  }).catch(function(e){ msg(e.message || "Couldn't check the website."); });
}

// ================= sync hookup =================
window.LG = { prefix: P, busy: function(){ return ov.classList.contains("on") && /<input|<select|<textarea/.test(sh.innerHTML) && !!sh.querySelector("#mSave,#bSave,#xSave,#sSave,#eSave"); }, reload: function(){ load(); migrate(); render(); }, refreshDetail: function(){} };

// ================= start =================
load(); var moved = migrate(); render();
if (moved) toast(moved + " records from your old Goldback app were copied in.");
loadPublic(); setTimeout(publishNow, 2000);
if (localStorage.getItem("gb_inq_key")){ setTimeout(function(){ inqSync(false); }, 1200); setInterval(function(){ if (!document.hidden) inqSync(false); }, 60000); }
document.addEventListener("visibilitychange", function(){ if (!document.hidden){ render(); if (localStorage.getItem("gb_inq_key")) inqSync(false); } });
})();
</script>
